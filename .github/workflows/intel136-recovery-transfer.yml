name: Transfer verified Intel 136 recovery ZIP
on:
  push:
    branches: [codex/intel136-recovery-transfer-20261028]
permissions:
  contents: write
concurrency:
  group: intel136-recovery-draft-426695679
  cancel-in-progress: false
jobs:
  transfer:
    if: github.repository == 'blessedconstructionems-del/thaddeus-releases' && github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify and transfer exact ZIP to the existing draft
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          python3 - <<'PY'
          """Transfer only the exact approved ZIP to the existing private draft state."""
          import datetime,hashlib,json,os,pathlib,subprocess,tempfile
          REPO='blessedconstructionems-del/thaddeus-releases'
          REPO_ID=1371712108
          MAIN='2ba913cadcd705d3d1883337df98337d313955e7'
          BRANCH='codex/intel136-recovery-transfer-20261028'
          WORKFLOW='.github/workflows/intel136-recovery-transfer.yml'
          RELEASE_ID=426695679
          TAG='v1.0.136-intel-recovery'
          NAME='Thaddeus-1.0.136-x64-mac.zip'
          SIZE=711197827
          DIGEST='49c95e0505392440874a0a9cdd6b4372dce64247eac802cbcf9818c839412276'
          EXPIRES='2026-10-28T14:03:49+00:00'
          SOURCE_URL='https://release-assets.githubusercontent.com/github-production-release-asset/1281409211/093eba6f-3b23-42bd-817d-3778b802ad44?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-10-28T14%3A03%3A49Z&rscd=attachment%3B+filename%3DThaddeus-1.0.136-x64-mac.zip&rsct=application%2Foctet-stream&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-10-28T13%3A02%3A50Z&ske=2026-10-28T14%3A03%3A49Z&sks=b&skv=2018-11-09&sig=HCmqa1IBC3wZIS1UUP4SkGshfZiAwax2cAN1Kst1gZM%3D&jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmVsZWFzZS1hc3NldHMuZ2l0aHVidXNlcmNvbnRlbnQuY29tIiwia2V5Ijoia2V5MSIsImV4cCI6MTc5MzE5NzcxOCwibmJmIjoxNzkzMTk0MTE4LCJwYXRoIjoicmVsZWFzZWFzc2V0cHJvZHVjdGlvbi5ibG9iLmNvcmUud2luZG93cy5uZXQifQ.0_JNHQWyOxr0Ps8A3UZfYlXWxxTW3tbcChE0VZLA0ts&response-content-disposition=attachment%3B%20filename%3DThaddeus-1.0.136-x64-mac.zip&response-content-type=application%2Foctet-stream'
          SUMS={'id':685074953,'name':'SHA256SUMS.txt','state':'uploaded','size':186,'digest':'sha256:267b348fa07451156689482bd010a1c31fd3335af82df613617e034c5292c8f1'}
          def api(route,*args):
              p=subprocess.run(['gh','api',route,*args],capture_output=True,text=True,timeout=600)
              if p.returncode:raise RuntimeError('GitHub API command failed: '+p.stderr)
              return json.loads(p.stdout)
          def summary(asset):return {k:asset.get(k) for k in ['id','name','state','size','digest']}
          def validate_release(release):
              assert release['id']==RELEASE_ID and release['tag_name']==TAG
              assert release['draft'] is True and release['prerelease'] is True
              assert release['target_commitish']==MAIN
              assert release['published_at'] is None
              return release['assets']
          def validate_zip(asset):
              assert asset['name']==NAME and asset['state']=='uploaded'
              assert asset['size']==SIZE and asset['digest']=='sha256:'+DIGEST
              assert isinstance(asset['id'],int) and asset['id']>0
              return summary(asset)
          def main():
              assert os.environ['GITHUB_EVENT_NAME']=='push'
              assert os.environ['GITHUB_REPOSITORY']==REPO
              assert os.environ['GITHUB_REF']=='refs/heads/'+BRANCH
              assert os.environ['GITHUB_RUN_ATTEMPT']=='1','Never rerun an ambiguous upload automatically'
              event=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
              commit=os.environ['GITHUB_SHA']
              assert event['before']==MAIN and event['after']==commit and event['ref']=='refs/heads/'+BRANCH
              assert not event.get('deleted',False)
              repo=api('repos/'+REPO);assert repo['id']==REPO_ID and repo['private'] is False and repo['archived'] is False
              assert api('repos/'+REPO+'/git/ref/heads/main')['object']['sha']==MAIN
              assert api('repos/'+REPO+'/git/ref/heads/'+BRANCH)['object']['sha']==commit
              change=api('repos/'+REPO+'/commits/'+commit)
              assert [x['sha'] for x in change['parents']]==[MAIN]
              assert len(change['files'])==1 and change['files'][0]['filename']==WORKFLOW and change['files'][0]['status']=='added'
              before=validate_release(api(f'repos/{REPO}/releases/{RELEASE_ID}'))
              assert [summary(x) for x in before]==[SUMS],'Unexpected draft assets; do not overwrite or delete'
              assert datetime.datetime.now(datetime.timezone.utc)<datetime.datetime.fromisoformat(EXPIRES)
              print(json.dumps({'phase':'download','releaseId':RELEASE_ID,'name':NAME,'expectedBytes':SIZE,'expectedSha256':DIGEST}),flush=True)
              with tempfile.TemporaryDirectory(prefix='intel136-exact-zip-',dir=os.environ['RUNNER_TEMP']) as directory:
                  archive=pathlib.Path(directory)/NAME
                  # Anonymous source request. Do not pass the repository token to curl.
                  env={'PATH':os.environ['PATH'],'HOME':os.environ['HOME']}
                  subprocess.run(['curl','--fail','--location','--silent','--show-error','--proto','=https',
                    '--tlsv1.2','--retry','0','--connect-timeout','30','--max-time','600',
                    '--max-filesize',str(SIZE),'--output',str(archive),SOURCE_URL],env=env,check=True,timeout=620)
                  assert archive.stat().st_size==SIZE
                  with archive.open('rb') as f:assert hashlib.file_digest(f,'sha256').hexdigest()==DIGEST
                  # Recheck after download so no delayed local upload can be overwritten.
                  assert [summary(x) for x in validate_release(api(f'repos/{REPO}/releases/{RELEASE_ID}'))]==[SUMS]
                  print(json.dumps({'phase':'upload-start','releaseId':RELEASE_ID,'name':NAME,'bytes':SIZE,'sha256':DIGEST}),flush=True)
                  asset=api(f'https://uploads.github.com/repos/{REPO}/releases/{RELEASE_ID}/assets?name={NAME}',
                    '--method','POST','--header','Content-Type: application/zip','--input',str(archive))
                  uploaded=validate_zip(asset)
              after=validate_release(api(f'repos/{REPO}/releases/{RELEASE_ID}'))
              assert len(after)==2 and sorted(x['name'] for x in after)==sorted([SUMS['name'],NAME])
              assert next(summary(x) for x in after if x['name']==SUMS['name'])==SUMS
              assert validate_zip(next(x for x in after if x['name']==NAME))==uploaded
              assert api('repos/'+REPO+'/git/ref/heads/main')['object']['sha']==MAIN
              receipt={'schema':1,'status':'uploaded-to-existing-draft','repository':REPO,'releaseId':RELEASE_ID,
                'tag':TAG,'draft':True,'prerelease':True,'releaseTarget':MAIN,'mainHeadUnchanged':True,
                'workflowCommit':commit,'workflowBranch':BRANCH,'runId':int(os.environ['GITHUB_RUN_ID']),
                'runAttempt':1,'asset':uploaded,'otherAssetUnchanged':SUMS,'artifactBytesChanged':False,
                'publicReleasePublished':False,'feedsChanged':False,'finishedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
              print('INTEL136_TRANSFER_RECEIPT='+json.dumps(receipt,sort_keys=True),flush=True)
          if __name__=='__main__':main()
          PY
